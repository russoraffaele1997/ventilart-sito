<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventilàrt — Sito in aggiornamento</title>
<meta name="description" content="Ventilàrt, progettazione e posa di facciate ventilate. Il sito è in aggiornamento: contattaci per informazioni o per un sopralluogo.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#1d2225;color:#fff;font:16px/1.6 'Jost',sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
  a{color:inherit;text-decoration:none}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
  .box{width:100%;max-width:640px;text-align:center}
  .logo{width:220px;max-width:70%;margin:0 auto 56px;display:block}
  .linea{width:56px;height:3px;background:#d7202b;margin:0 auto 22px}
  .etichetta{font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  h1{font-weight:300;font-size:clamp(34px,6vw,52px);line-height:1.12;letter-spacing:-.02em;margin:14px 0 18px}
  p.testo{color:rgba(255,255,255,.75);font-size:17px;max-width:500px;margin:0 auto}
  .contatti{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:44px 0 0}
  .contatti a{display:block;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:16px 12px;transition:border-color .2s,background .2s}
  .contatti a:hover{border-color:#d7202b;background:rgba(255,255,255,.03)}
  .contatti small{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:4px}
  .contatti b{font-weight:400;font-size:16px;word-break:break-word}
  footer{padding:24px;text-align:center;font-size:13px;color:rgba(255,255,255,.5)}
  footer a{text-decoration:underline;text-underline-offset:3px}
  @media (max-width:600px){
    .contatti{grid-template-columns:1fr}
    .logo{margin-bottom:40px}
  }
</style>
</head>
<body>
<main>
  <div class="box">
    <img class="logo" src="/assets/logo/ventilart-logo-bianco.svg" alt="Ventilàrt">
    <div class="linea"></div>
    <span class="etichetta">Facciate ventilate</span>
    <h1>Stiamo rinnovando il sito</h1>
    <p class="testo">Torniamo online a breve. Nel frattempo siamo raggiungibili per informazioni e per richiedere un sopralluogo.</p>
    <div class="contatti">
      <a href="tel:+393793016458"><small>Telefono</small><b>379 301 6458</b></a>
      <a href="https://wa.me/393793016458" target="_blank" rel="noopener"><small>WhatsApp</small><b>Scrivici</b></a>
      <a href="mailto:ventilart@ventilart.it"><small>Email</small><b>ventilart@ventilart.it</b></a>
    </div>
  </div>
</main>
<footer>Ventilàrt · Via Padula 19, 80026 Casoria (NA) · <a href="https://www.instagram.com/ventilart_facciateventilate/" target="_blank" rel="noopener">Instagram</a></footer>
</body>
</html>
