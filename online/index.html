<title>Ventilàrt — Facciate ventilate</title>
<meta name="description" content="Ventilàrt: facciate ventilate e rivestimenti architettonici in gres porcellanato, fibrocemento, legno e composito. Il nuovo sito è in arrivo.">

<style>
  /* Pagina provvisoria: nessun font, script o servizio esterno (niente cookie). */
  :root { --antracite: #1d2225; --antracite-2: #2b3236; --rosso: #E31E2B; --chiaro: #f6f6f5; --tenue: #aeb4b8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100%; display: flex; flex-direction: column; color: var(--chiaro); overflow-x: hidden; position: relative;
    background: radial-gradient(120% 90% at 50% 0%, var(--antracite-2) 0%, var(--antracite) 60%);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* Grande V in filigrana sullo sfondo, appare lentamente e "respira" */
  .filigrana {
    position: fixed; right: -6vw; bottom: -8vh; width: min(62vw, 720px); height: auto; pointer-events: none; z-index: 0;
    opacity: 0; animation: filigrana 3.2s ease-out .3s forwards, respiro 14s ease-in-out 3.5s infinite alternate;
  }
  /* Velo di luce che attraversa lo sfondo una volta */
  .luce {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0;
    background: linear-gradient(115deg, transparent 35%, #ffffff0d 50%, transparent 65%);
    background-size: 250% 100%; animation: luce 3.5s ease-in-out 1.2s forwards;
  }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 16px; position: relative; z-index: 1; }
  .logo { width: min(260px, 60vw); height: auto; overflow: visible; }
  .simbolo, .scritta { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; }
  .simbolo { animation: simbolo 1.4s cubic-bezier(.2,.7,.2,1) .2s forwards; }
  .scritta { animation: sale 1.1s cubic-bezier(.2,.7,.2,1) 1s forwards; }
  .riga { width: 0; height: 3px; background: var(--rosso); margin: 36px auto 28px; animation: riga .9s cubic-bezier(.6,0,.2,1) 1.6s forwards; }
  h1 {
    font-family: "Arial Narrow", "Roboto Condensed", "Segoe UI", sans-serif; font-stretch: condensed;
    font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: clamp(22px, 4.2vw, 34px);
  }
  .sotto { margin-top: 14px; color: var(--tenue); font-size: clamp(15px, 2.4vw, 17px); line-height: 1.6; max-width: 34em; }
  .contatti { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .contatti a {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border: 1px solid #ffffff33;
    color: var(--chiaro); text-decoration: none; font-weight: 600; letter-spacing: .02em;
    transition: background .25s, border-color .25s, transform .25s;
  }
  .contatti a:hover, .contatti a:focus-visible { background: var(--rosso); border-color: var(--rosso); transform: translateY(-2px); outline: none; }
  .sede { margin-top: 22px; color: var(--tenue); font-size: 14px; }
  footer { padding: 18px 16px 24px; text-align: center; color: #ffffff66; font-size: 12px; position: relative; z-index: 1; }

  /* Testi che salgono uno dopo l'altro */
  .entra { opacity: 0; animation: sale 1s cubic-bezier(.2,.7,.2,1) forwards; }
  h1.entra { animation-delay: 1.9s; }
  .sotto.entra { animation-delay: 2.15s; }
  .contatti.entra { animation-delay: 2.4s; }
  .sede.entra { animation-delay: 2.6s; }
  footer.entra { animation-delay: 2.8s; }

  @keyframes simbolo { from { opacity: 0; transform: scale(.92); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes sale { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes riga { to { width: 56px; } }
  @keyframes filigrana { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  @keyframes respiro { from { transform: none; } to { transform: translate(-1.5vw, -2vh) scale(1.03); } }
  @keyframes luce { 0% { opacity: 1; background-position: 120% 0; } 100% { opacity: 1; background-position: -120% 0; } }

  /* Chi ha chiesto meno movimento al computer vede la pagina subito, senza animazioni */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .simbolo, .scritta, .entra, .filigrana { opacity: 1; }
    .riga { width: 56px; }
    .luce { display: none; }
  }
</style>
</head>
